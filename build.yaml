owner: "marceljhuber"
overview: "Tinder-style swiping over your library until everyone matches"
description: >
  Pick libraries and genres, open a lobby (4-digit code + QR), and everyone swipes on their phone.
  The first titles everyone swiped right on win, and JellySwipe can start the winner on any
  Jellyfin device. Guests don't need a Jellyfin account.
